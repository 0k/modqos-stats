[package]
name = "modqos-stats"
version = "0.1.0"
edition = "2021"
description = "vps stats plugin reporting Apache mod_qos request counters"
license = "MIT"
authors = ["Valentin Lab <valentin.lab@kalysto.org>"]

# No runtime dependencies, by design: the binary must stay as small as
# possible and build as one static musl executable (see AGENTS.md).
[dependencies]

[dev-dependencies]
indoc = "2"
similar = "2"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
